[project]
name = "agency"
version = "0.1.0"
requires-python = ">=3.11"
# Lower bounds are security floors; upper bounds keep the resolver on a tested line.
# starlette>=1.3.1 clears all 8 known advisories (DoS + host-header path desync). The app
# was migrated to Starlette 1.x's `TemplateResponse(request, name, context)` signature at
# every render site. For reproducible installs use requirements.lock.
dependencies = [
    "fastapi>=0.139,<1.0",
    "starlette>=1.3.1,<2",      # >=1.3.1 clears all known starlette advisories
    "uvicorn[standard]>=0.49,<1.0",
    "jinja2>=3.1.6,<4",
    "markdown>=3.10,<4",
    "pyyaml>=6.0.2,<7",
    "markupsafe>=3.0,<4",
    "python-multipart>=0.0.20,<0.1",
    "nh3>=0.3,<1.0",
]

[project.scripts]
agency = "agency.cli:main"

[tool.setuptools.packages.find]
include = ["agency*"]

[tool.setuptools.package-data]
agency = ["templates/*.html", "static/*", "themes/*.yaml"]
